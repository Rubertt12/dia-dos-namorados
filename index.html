<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff75a8" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --pink-1: #fff4f8;
  --pink-2: #ffd7e5;
  --pink-3: #ffafca;
  --pink-4: #ff75a8;
  --pink-5: #e94885;
  --rose: #b82e65;
  --wine: #6f2343;
  --cream: #fffaf5;
  --text: #5d3344;
  --white: #ffffff;
  --shadow: 0 22px 60px rgba(154, 44, 92, .16);
  --radius: 30px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--text);
  font-family: 'Montserrat', sans-serif;
  background:
    radial-gradient(circle at 10% 10%, rgba(255,255,255,.95), transparent 28%),
    radial-gradient(circle at 90% 30%, rgba(255,197,220,.45), transparent 30%),
    linear-gradient(180deg, #fff9fb 0%, #fff2f6 40%, #fffaf5 100%);
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .2;
  background-image:
    radial-gradient(#ff8fb8 1px, transparent 1px),
    radial-gradient(#ffd0df 1.2px, transparent 1.2px);
  background-position: 0 0, 18px 18px;
  background-size: 36px 36px;
  z-index: -1;
}

button, a { font: inherit; }
a { color: inherit; }

.glass {
  background: rgba(255,255,255,.68);
  border: 1px solid rgba(255,255,255,.82);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.hero {
  min-height: 100vh;
  position: relative;
  display: grid;
  place-items: center;
  padding: 130px 24px 70px;
  isolation: isolate;
  background:
    linear-gradient(rgba(255,243,248,.42), rgba(255,246,249,.88)),
    radial-gradient(circle at 50% 20%, #fff 0 12%, transparent 40%),
    linear-gradient(135deg, #ffe3ee, #fff9fb 48%, #ffd4e3);
}

.hero::before,
.hero::after {
  content: '';
  position: absolute;
  width: 310px;
  height: 310px;
  border-radius: 48% 52% 63% 37% / 43% 37% 63% 57%;
  filter: blur(2px);
  opacity: .55;
  z-index: -1;
  animation: blob 11s ease-in-out infinite;
}
.hero::before { background: #ffc1d6; left: -80px; top: 16%; }
.hero::after { background: #ffe9b7; right: -90px; bottom: 8%; animation-delay: -5s; }

@keyframes blob {
  0%,100% { transform: translate(0,0) rotate(0deg) scale(1); }
  50% { transform: translate(20px,-25px) rotate(9deg) scale(1.08); }
}

.navbar {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: min(1120px, calc(100% - 30px));
  border-radius: 999px;
  padding: 12px 14px 12px 20px;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  text-decoration: none;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  color: var(--wine);
}
.nav-links { display: flex; gap: 8px; }
.nav-links a {
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 999px;
  font-size: .88rem;
  font-weight: 700;
}
.nav-links a:hover { background: var(--pink-2); }
.menu-btn {
  display: none;
  border: 0;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  background: var(--pink-2);
  color: var(--wine);
  cursor: pointer;
}

.hero-content { text-align: center; width: min(900px, 100%); }
.tiny-badge {
  display: inline-flex;
  padding: 9px 16px;
  border: 1px solid rgba(233,72,133,.18);
  border-radius: 999px;
  background: rgba(255,255,255,.75);
  box-shadow: 0 10px 30px rgba(233,72,133,.08);
  font-size: .82rem;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.eyebrow {
  margin: 22px 0 8px;
  color: var(--rose);
  text-transform: uppercase;
  font-size: .76rem;
  letter-spacing: .25em;
  font-weight: 800;
}
.hero h1 {
  margin: 0;
  font-family: 'Great Vibes', cursive;
  font-size: clamp(4.3rem, 11vw, 8.7rem);
  line-height: .95;
  font-weight: 400;
  color: var(--wine);
  text-shadow: 0 10px 28px rgba(111,35,67,.12);
}
.hero h1 b {
  display: inline-block;
  color: var(--pink-5);
  font-family: inherit;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(1.13); } }
.hero-copy {
  width: min(680px, 100%);
  margin: 22px auto 0;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.1rem, 2vw, 1.45rem);
  line-height: 1.6;
  color: #73445a;
}
.hero-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 30px;
}
.btn {
  appearance: none;
  border: 0;
  text-decoration: none;
  padding: 14px 22px;
  border-radius: 999px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.btn:hover { transform: translateY(-3px); }
.btn.primary {
  background: linear-gradient(135deg, var(--pink-5), var(--pink-4));
  color: white;
  box-shadow: 0 14px 34px rgba(233,72,133,.28);
}
.btn.soft { background: #fff; color: var(--rose); box-shadow: 0 10px 30px rgba(111,35,67,.08); }

.love-counter {
  width: min(690px, 100%);
  margin: 42px auto 0;
  border-radius: 28px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  overflow: hidden;
}
.love-counter > div { padding: 20px 12px; position: relative; }
.love-counter > div:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 25%;
  width: 1px;
  height: 50%;
  background: rgba(111,35,67,.12);
}
.love-counter strong { display: block; font-family: 'Playfair Display', serif; font-size: clamp(1.5rem,4vw,2.4rem); color: var(--rose); }
.love-counter span { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
.counter-caption { font-size: .8rem; opacity: .8; }
.scroll-cue { position: absolute; bottom: 26px; color: var(--pink-5); font-size: 1.8rem; animation: bounce 1.4s ease-in-out infinite; }
@keyframes bounce { 50% { transform: translateY(8px); } }

.section { width: min(1160px, calc(100% - 34px)); margin: 0 auto; padding: 100px 0; }
.section-heading { text-align: center; margin-bottom: 50px; }
.section-heading > span { font-size: 2rem; }
.section-heading p { margin: 9px 0 5px; color: var(--rose); font-weight: 700; }
.section-heading h2 {
  margin: 0;
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: var(--wine);
}

.love-note-card {
  position: relative;
  margin: 0 auto;
  width: min(820px, 100%);
  border-radius: var(--radius);
  padding: 46px;
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.05rem, 2vw, 1.3rem);
  line-height: 1.8;
}
.ribbon {
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  background: var(--pink-5);
  color: #fff;
  padding: 8px 22px;
  border-radius: 8px;
  font-family: 'Great Vibes', cursive;
  font-size: 1.5rem;
  box-shadow: 0 8px 18px rgba(233,72,133,.22);
}

.timeline { position: relative; width: min(860px, 100%); margin: 0 auto; }
.timeline::before {
  content: '';
  position: absolute;
  left: 33px;
  top: 10px;
  bottom: 10px;
  width: 2px;
  background: linear-gradient(var(--pink-3), var(--pink-5), var(--pink-2));
}
